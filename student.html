<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard – Little Planet Academy</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .dash { max-width: 900px; margin: 24px auto; padding: 0 16px 48px; }
    .welcome { background: linear-gradient(135deg, var(--purple), var(--purple-mid)); color: #fff; border-radius: 16px; padding: 22px 20px; margin-bottom: 24px; }
    .welcome h1 { font-size: 1.35rem; margin-bottom: 4px; }
    .welcome p { opacity: 0.9; font-size: 0.95rem; }
    .section-title { font-size: 1.15rem; color: var(--purple-dark); margin: 28px 0 12px; font-weight: 700; }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px;
      margin-bottom: 14px; box-shadow: 0 2px 12px rgba(91,44,138,0.06);
    }
    .card h3 { font-size: 1rem; margin-bottom: 8px; color: var(--purple); }
    .result-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .result-table th, .result-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
    .result-table th { background: var(--purple-soft); color: var(--purple-dark); font-weight: 600; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge.pos { background: #fef3c7; color: #92400e; }
    .fee-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .fee-amount { font-weight: 700; color: var(--purple-dark); font-size: 1.1rem; }
    .btn-pay {
      background: linear-gradient(135deg, #0f9d58, #34a853); color: #fff; border: none;
      padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-logout {
      background: transparent; border: 1px solid #fff; color: #fff; padding: 6px 14px;
      border-radius: 8px; cursor: pointer; font-size: 0.85rem; margin-top: 10px;
    }
    .empty { color: var(--muted); font-size: 0.95rem; padding: 12px 0; }
    .term-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .term-tabs button {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
      cursor: pointer; font-weight: 500; font-size: 0.9rem;
    }
    .term-tabs button.active { background: var(--purple); color: #fff; border-color: var(--purple); }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html" class="logo">
        <div class="logo-mark">🌍</div>
        <div class="logo-text">Little Planet Academy<span>Student Portal</span></div>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="#" id="logoutNav">Logout</a>
      </div>
      <button class="hamburger" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="#" id="logoutMobile">Logout</a>
    </div>
  </header>

  <main class="dash" id="dash" style="display:none;">
    <div class="welcome">
      <h1 id="welcomeName">Welcome</h1>
      <p id="welcomeClass">Class: —</p>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>

    <h2 class="section-title">My Results</h2>
    <div class="term-tabs" id="termTabs"></div>
    <div class="card" id="resultsCard">
      <p class="empty" id="resultsEmpty">Loading results...</p>
      <div id="resultsContent" style="display:none;"></div>
    </div>

    <h2 class="section-title">Scheme of Work</h2>
    <div class="term-tabs" id="schemeTermTabs"></div>
    <div id="schemeStudentList">
      <p class="empty">Loading scheme of work...</p>
    </div>

    <h2 class="section-title">School Fees & Payments</h2>
    <div id="feesList">
      <p class="empty">Loading fees...</p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
  <script>
    let currentUser = null;
    let profile = null;
    let selectedTerm = '1st Term';
    let allResults = {};

    function logout() {
      auth.signOut().then(() => window.location.href = 'login.html');
    }
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('logoutNav').onclick = (e) => { e.preventDefault(); logout(); };
    document.getElementById('logoutMobile').onclick = (e) => { e.preventDefault(); logout(); };

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      profile = await getUserProfile(user.uid);
      if (!profile) {
        await auth.signOut();
        window.location.href = 'login.html';
        return;
      }
      if (profile.role === 'admin') {
        window.location.href = 'admin.html';
        return;
      }
      document.getElementById('dash').style.display = 'block';
      document.getElementById('welcomeName').textContent = 'Welcome, ' + profile.fullName;
      document.getElementById('welcomeClass').textContent = 'Class: ' + profile.class;

      // Term tabs
      const tabs = document.getElementById('termTabs');
      tabs.innerHTML = '';
      TERMS.forEach(t => {
        const b = document.createElement('button');
        b.textContent = t;
        if (t === selectedTerm) b.classList.add('active');
        b.onclick = () => {
          selectedTerm = t;
          tabs.querySelectorAll('button').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          renderResults();
        };
        tabs.appendChild(b);
      });

      await loadResults();
      await loadStudentSchemes();
      await loadFees();
    });

    async function loadResults() {
      const snap = await db.collection('results')
        .where('studentId', '==', currentUser.uid)
        .get();
      allResults = {};
      snap.forEach(doc => {
        const d = doc.data();
        allResults[d.term] = d;
      });
      renderResults();
    }

    function renderResults() {
      const empty = document.getElementById('resultsEmpty');
      const content = document.getElementById('resultsContent');
      const data = allResults[selectedTerm];
      if (!data || !data.subjects || !data.subjects.length) {
        empty.style.display = 'block';
        empty.textContent = 'No results uploaded for ' + selectedTerm + ' yet.';
        content.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      content.style.display = 'block';
      let html = '<table class="result-table"><thead><tr><th>Subject</th><th>Grade</th><th>Score</th></tr></thead><tbody>';
      data.subjects.forEach(s => {
        html += `<tr><td>${s.subject}</td><td>${s.grade || '—'}</td><td>${s.score != null ? s.score : '—'}</td></tr>`;
      });
      html += `</tbody></table>
        <p style="margin-top:12px;"><strong>Total Score:</strong> ${data.total || 0}
        &nbsp;&nbsp; <span class="badge pos">Position: ${data.position || '—'}</span></p>`;
      content.innerHTML = html;
    }

    let selectedSchemeTerm = '1st Term';

    async function loadStudentSchemes() {
      // Term tabs for scheme
      const tabs = document.getElementById('schemeTermTabs');
      tabs.innerHTML = '';
      const schemeTerms = ['1st Term', '2nd Term', '3rd Term', 'Full Year'];
      schemeTerms.forEach(t => {
        const b = document.createElement('button');
        b.textContent = t;
        if (t === selectedSchemeTerm) b.classList.add('active');
        b.onclick = () => {
          selectedSchemeTerm = t;
          tabs.querySelectorAll('button').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          renderStudentSchemes();
        };
        tabs.appendChild(b);
      });
      await renderStudentSchemes();
    }

    let cachedSchemes = [];
    async function renderStudentSchemes() {
      const el = document.getElementById('schemeStudentList');
      if (!cachedSchemes.length) {
        const snap = await db.collection('schemes')
          .where('class', '==', profile.class)
          .get();
        cachedSchemes = [];
        snap.forEach(doc => cachedSchemes.push({ id: doc.id, ...doc.data() }));
      }
      const items = cachedSchemes.filter(s => s.term === selectedSchemeTerm);
      if (!items.length) {
        el.innerHTML = '<p class="empty">No scheme of work for your class in ' + selectedSchemeTerm + ' yet.</p>';
        return;
      }
      el.innerHTML = '';
      items.sort((a, b) => (a.subject || '').localeCompare(b.subject || ''));
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3 style="color:var(--purple);margin-bottom:6px;">${item.subject || 'Subject'}</h3>
          <div style="font-size:0.85rem;color:var(--muted);margin-bottom:10px;">${item.class} · ${item.term}</div>
          <div style="white-space:pre-wrap;font-size:0.95rem;line-height:1.6;">${(item.content || '').replace(/</g, '&lt;')}</div>
        `;
        el.appendChild(card);
      });
    }

    async function loadFees() {
      const list = document.getElementById('feesList');
      // Fees that apply to this student's class (or "All")
      const snap = await db.collection('fees').get();
      const fees = [];
      snap.forEach(doc => {
        const d = doc.data();
        if (d.classes && (d.classes.includes(profile.class) || d.classes.includes('All'))) {
          fees.push({ id: doc.id, ...d });
        }
      });

      // Check paid
      const paySnap = await db.collection('payments')
        .where('studentId', '==', currentUser.uid)
        .where('status', '==', 'success')
        .get();
      const paidFeeIds = new Set();
      paySnap.forEach(doc => paidFeeIds.add(doc.data().feeId));

      if (!fees.length) {
        list.innerHTML = '<p class="empty">No fees assigned to your class yet.</p>';
        return;
      }

      list.innerHTML = '';
      fees.forEach(fee => {
        const paid = paidFeeIds.has(fee.id);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="fee-row">
            <div>
              <h3>${fee.category || fee.name || 'Fee'}</h3>
              <p style="color:var(--muted);font-size:0.9rem;">${fee.description || ''}</p>
              <div class="fee-amount">₦${Number(fee.amount).toLocaleString()}</div>
            </div>
            <div>
              ${paid
                ? '<span class="badge" style="background:#d1fae5;color:#065f46;">Paid ✓</span>'
                : `<button class="btn-pay" data-id="${fee.id}" data-amount="${fee.amount}" data-name="${fee.category || fee.name}">Pay Now</button>`
              }
            </div>
          </div>`;
        list.appendChild(card);
      });

      list.querySelectorAll('.btn-pay').forEach(btn => {
        btn.onclick = () => payFee(btn.dataset.id, Number(btn.dataset.amount), btn.dataset.name, btn);
      });
    }

    function payFee(feeId, amount, feeName, btn) {
      const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: profile.email || (currentUser.email),
        amount: Math.round(amount * 100), // kobo
        currency: 'NGN',
        ref: 'LL-' + feeId + '-' + currentUser.uid.slice(0,8) + '-' + Date.now(),
        metadata: {
          studentId: currentUser.uid,
          studentName: profile.fullName,
          class: profile.class,
          feeId: feeId,
          feeName: feeName
        },
        callback: function(response) {
          // Record payment
          db.collection('payments').add({
            studentId: currentUser.uid,
            studentName: profile.fullName,
            class: profile.class,
            feeId: feeId,
            feeName: feeName,
            amount: amount,
            reference: response.reference,
            status: 'success',
            paidAt: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => {
            alert('Payment successful! Reference: ' + response.reference);
            loadFees();
          });
        },
        onClose: function() {
          // user closed
        }
      });
      handler.openIframe();
    }
  </script>
</body>
</html>
